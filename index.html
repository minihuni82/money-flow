<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통장 흐름</title>
<meta name="description" content="통장 잔액, 카드 결제 예정액, 계좌 이체를 한 화면에서 관리합니다.">
<meta name="theme-color" content="#E9EDE4">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통장 흐름">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#E9EDE4; --sheet:#FBFCF9;
  --ink:#17233A; --ink-soft:#5C6675; --ink-faint:#8D9484;
  --rule:#CBD2C3; --rule-soft:#DFE4D8;
  --out:#A8322F; --in:#1C6B52; --due:#8A5A16;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.masthead h1{font-size:1.05rem}
.masthead .today{font-size:.82rem;color:var(--ink-faint)}

.hero{padding:34px 0 30px;border-bottom:1px solid var(--rule)}
.hero .label{font-size:.86rem;color:var(--ink-soft);margin-bottom:6px}
.hero .figure{font-size:clamp(2.5rem,9vw,4.2rem);font-weight:500;line-height:1.02;display:block}
.hero .figure.negative{color:var(--out)}
.hero .equation{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.9rem;color:var(--ink-soft)}
.hero .equation b{font-weight:500;color:var(--ink)}
.hero .equation .op{color:var(--ink-faint)}
.hero .warn{margin-top:14px;font-size:.86rem;color:var(--out)}

.cols{display:grid;grid-template-columns:1fr 1fr}
.col{padding:22px 0}
.col:first-child{padding-right:26px;border-right:1px solid var(--rule)}
.col:last-child{padding-left:26px}
@media (max-width:720px){
  .cols{grid-template-columns:1fr}
  .col:first-child{padding-right:0;border-right:0;border-bottom:1px solid var(--rule)}
  .col:last-child{padding-left:0}
}
.colhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.colhead h2{font-size:.95rem}
.colhead .sum{font-size:.9rem;font-weight:500}

.row{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--rule-soft)}
.row:first-of-type{border-top:0}
.row .name{flex:1;min-width:0}
.row .name .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name .s{display:block;font-size:.78rem;color:var(--ink-faint)}
.row .amt{font-weight:500;white-space:nowrap}
.row .amt.due{color:var(--due)}
.row .tools{display:flex;gap:2px;opacity:.55}
.row:hover .tools,.row:focus-within .tools{opacity:1}
.icon{background:none;border:0;padding:3px 5px;font-size:.78rem;color:var(--ink-soft);border-radius:3px}
.icon:hover{background:var(--rule-soft);color:var(--ink)}

.brk{font-size:.76rem;color:var(--ink-faint);padding:0 0 9px;margin-top:-6px;word-break:keep-all}
.subhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:9px;border-top:1px solid var(--rule);font-size:.85rem;color:var(--ink-soft)}
.modal.wide{max-width:760px}
.prev{max-height:44vh;overflow:auto;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:4px 0 12px}
.prow{display:grid;grid-template-columns:22px 52px 1fr 96px 108px;align-items:center;gap:8px;padding:7px 2px;border-top:1px solid var(--rule-soft);font-size:.86rem}
.prow:first-child{border-top:0}
.prow.dup{opacity:.5}
.prow .pm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pa{text-align:right;font-weight:500}
.prow .pa.minus{color:var(--in)}
.prow select{padding:3px 5px;font-size:.8rem;background:#fff;border:1px solid var(--rule);border-radius:3px;width:100%}
.prow input[type=checkbox]{width:16px;height:16px;accent-color:#17233A}
.tag{font-size:.72rem;color:var(--ink-faint);border:1px solid var(--rule);border-radius:99px;padding:0 5px;margin-left:5px}
.tally{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.86rem;padding:2px 0 4px}
.tally .match{color:var(--in)}
.tally .diff{color:var(--out)}
@media (max-width:640px){
  .prow{grid-template-columns:22px 46px 1fr 84px;row-gap:4px}
  .prow select{grid-column:3 / span 2}
}
.addlink{background:none;border:0;padding:0;margin-top:10px;font-size:.85rem;color:var(--ink-soft);border-bottom:1px solid var(--rule)}
.addlink:hover{color:var(--ink);border-color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.act{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:9px 16px;font-weight:500;transition:background .12s,border-color .12s}
.act:hover{background:#fff;border-color:var(--ink)}
.act.primary{background:var(--ink);border-color:var(--ink);color:#F7F8F4}
.act.primary:hover{background:#0F1927}
.act.quiet{background:none}

.section{padding:24px 0;border-bottom:1px solid var(--rule)}
.sechead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.sechead h2{font-size:.95rem}
.pair{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:20px}
.pair div span{display:block;font-size:.8rem;color:var(--ink-soft)}
.pair div strong{font-size:1.25rem;font-weight:500}
.pair .o strong{color:var(--out)}
.pair .i strong{color:var(--in)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:12px;font-size:.88rem}
.bar .track{height:7px;background:var(--rule-soft);border-radius:2px;overflow:hidden}
.bar .fill{height:100%;background:var(--out);opacity:.75}
.bar .v{font-size:.85rem;color:var(--ink-soft)}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--rule);border-radius:99px;padding:3px 12px;font-size:.82rem;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F7F8F4}
.lrow{display:grid;grid-template-columns:56px 1fr auto 28px;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--rule-soft)}
.lrow .d{font-size:.8rem;color:var(--ink-faint)}
.lrow .m{min-width:0}
.lrow .m .t{display:block}
.lrow .m .s{display:block;font-size:.78rem;color:var(--ink-faint)}
.lrow .a{font-weight:500;white-space:nowrap}
.lrow .a.o{color:var(--out)}
.lrow .a.i{color:var(--in)}
.lrow .a.n{color:var(--ink-soft)}
.lrow .x{opacity:.35}
.lrow:hover .x,.lrow:focus-within .x{opacity:1}

.empty{padding:40px 0;max-width:48ch}
.empty p{color:var(--ink-soft);margin:0 0 16px}
.hint{font-size:.85rem;color:var(--ink-faint);padding:14px 0}

footer{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:22px;font-size:.82rem;color:var(--ink-faint)}
footer .fbtns{display:flex;gap:8px;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--rule);border-radius:var(--r);padding:5px 11px;font-size:.82rem;color:var(--ink-soft)}
footer button:hover{border-color:var(--ink);color:var(--ink)}
#syncState{display:inline-flex;align-items:center;gap:6px}
#syncState .dot{width:7px;height:7px;border-radius:99px;background:var(--ink-faint)}
#syncState.ok .dot{background:var(--in)}
#syncState.wait .dot{background:var(--due)}
#syncState.bad .dot{background:var(--out)}

.veil{position:fixed;inset:0;background:rgba(23,35,58,.32);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto;z-index:40}
.veil.open{display:flex}
.modal{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;width:100%;max-width:440px;padding:22px;margin:auto}
.modal h3{font-size:1rem;margin-bottom:4px}
.modal .sub{font-size:.84rem;color:var(--ink-soft);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.83rem;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;background:#fff;border:1px solid var(--rule);
  border-radius:var(--r);font-family:inherit;font-size:.95rem;color:var(--ink)
}
.field textarea{min-height:110px;font-family:"IBM Plex Mono",monospace;font-size:.8rem}
.field input.money{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:1.1rem;text-align:right}
.field .note{font-size:.78rem;color:var(--ink-faint);margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;background:#fff;border:1px solid var(--rule);border-radius:var(--r);padding:7px 4px;font-size:.86rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F7F8F4}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.mfoot .right{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--out);font-size:.84rem;min-height:1.2em}
.steps{font-size:.86rem;color:var(--ink-soft);padding-left:1.2em;margin:0 0 16px}
.steps li{margin-bottom:5px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:#F7F8F4;padding:9px 18px;border-radius:99px;font-size:.88rem;
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:60;max-width:88vw;text-align:center
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>통장 흐름</h1>
    <span class="today num" id="today"></span>
  </div>

  <div id="app"><div class="hint">불러오는 중…</div></div>

  <footer>
    <span id="syncState"><span class="dot"></span><span id="syncText">시작 중</span></span>
    <span class="fbtns">
      <button id="btnSync">지금 동기화</button>
      <button id="btnSetup">동기화 설정</button>
      <button id="btnBackup">백업·복원</button>
      <button id="btnExport">CSV 내보내기</button>
    </span>
  </footer>
</div>

<div class="veil" id="veil"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ══ 저장 계층 ══════════════════════════════════════════
   서버(Google Sheets)가 정본, 브라우저 캐시는 빠른 표시와 오프라인용.
   설정 전에는 이 기기에만 저장됩니다.                        */

const CACHE_KEY = 'moneyflow:cache';
const CFG_KEY   = 'moneyflow:cfg';
const mem = {};
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

let S    = { accounts:[], cards:[], txns:[] };
let rev  = 0;          // 서버가 준 버전
let dirty = false;     // 아직 서버에 못 올린 변경이 있음
let cfg  = { url:'', key:'' };
let filter = 'all', month = null, pushTimer = null, syncing = false;

function loadCfg(){
  try{ cfg = Object.assign({url:'',key:''}, JSON.parse(LS.get(CFG_KEY)||'{}')); }catch(e){}
}
function saveCfg(){ LS.set(CFG_KEY, JSON.stringify(cfg)); }
function loadCache(){
  try{
    const c = JSON.parse(LS.get(CACHE_KEY)||'null');
    if(c && c.state){ S = Object.assign({accounts:[],cards:[],txns:[]}, c.state); rev = c.rev||0; dirty = !!c.dirty; }
  }catch(e){}
}
function saveCache(){ LS.set(CACHE_KEY, JSON.stringify({rev, state:S, dirty})); }

function status(kind, text){
  const el = document.getElementById('syncState');
  el.className = kind;
  document.getElementById('syncText').textContent = text;
}
const stamp = ()=>{ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

/** 서버에서 내려받기 */
async function pull(opts={}){
  if(!cfg.url || !cfg.key){ status('', '이 기기에만 저장'); return; }
  if(dirty && !opts.force){ push(); return; }
  status('wait','불러오는 중');
  try{
    const r = await fetch(cfg.url + '?key=' + encodeURIComponent(cfg.key) + '&t=' + Date.now());
    const j = await r.json();
    if(!j.ok) throw new Error(j.error==='auth' ? '키가 맞지 않습니다' : j.error);
    if(j.state){ S = Object.assign({accounts:[],cards:[],txns:[]}, j.state); }
    rev = j.rev||0; dirty = false; saveCache();
    const made = runAutos();
    render();
    status('ok','동기화됨 · ' + stamp());
    if(made) toast(`자동이체 ${made}건을 기록했습니다.`);
  }catch(e){
    status('bad','불러오지 못함 (' + (e.message||'네트워크') + ')');
  }
}

/** 서버로 올리기 */
function queuePush(){
  dirty = true; saveCache();
  if(!cfg.url || !cfg.key){ status('','이 기기에만 저장 · ' + stamp()); return; }
  status('wait','저장 중');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 450);
}
async function push(opts={}){
  if(!cfg.url || !cfg.key || syncing) return;
  syncing = true;
  try{
    const r = await fetch(cfg.url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},  // 프리플라이트 없이 보내기
      body: JSON.stringify({ key:cfg.key, state:S, baseRev:rev, force:!!opts.force })
    });
    const j = await r.json();
    if(j.ok){ rev = j.rev; dirty = false; saveCache(); status('ok','동기화됨 · ' + stamp()); }
    else if(j.error === 'conflict'){ status('bad','다른 기기와 충돌'); conflictModal(j); }
    else throw new Error(j.error==='auth' ? '키가 맞지 않습니다' : j.error);
  }catch(e){
    status('bad','저장 대기 중 (' + (e.message||'네트워크') + ')');
  }finally{ syncing = false; }
}

function conflictModal(server){
  const m = document.getElementById('modal');
  m.innerHTML = `
    <h3>다른 기기에서 먼저 저장했습니다</h3>
    <p class="sub">이 기기의 변경과 서버 내용이 갈렸습니다. 어느 쪽을 남길지 고르세요.</p>
    <div class="field">
      <label>서버 내용</label>
      <div class="num">거래 ${(server.state&&server.state.txns||[]).length}건 · 버전 ${server.rev}</div>
    </div>
    <div class="field">
      <label>이 기기 내용</label>
      <div class="num">거래 ${S.txns.length}건 · 아직 저장 안 됨</div>
    </div>
    <div class="mfoot"><span></span><span class="right">
      <button class="act" id="takeServer">서버 것 쓰기</button>
      <button class="act primary" id="takeLocal">이 기기 것으로 덮어쓰기</button>
    </span></div>`;
  document.getElementById('veil').classList.add('open');
  document.getElementById('takeServer').onclick = ()=>{
    if(server.state) S = Object.assign({accounts:[],cards:[],txns:[]}, server.state);
    rev = server.rev; dirty = false; saveCache(); closeModal(); render();
    status('ok','서버 내용으로 맞췄습니다'); toast('서버 내용을 가져왔습니다.');
  };
  document.getElementById('takeLocal').onclick = ()=>{
    rev = server.rev; closeModal(); push({force:true}); toast('이 기기 내용으로 저장합니다.');
  };
}

/* ══ 유틸 ══════════════════════════════════════════════ */
const $ = s=>document.querySelector(s);
const uid = ()=> Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const won = n => (n<0?'-':'') + '₩' + Math.abs(Math.round(n)).toLocaleString('ko-KR');
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = ()=> ymd(new Date());
const monthOf = s => s.slice(0,7);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }
function commit(msg){ saveCache(); queuePush(); render(); if(msg) toast(msg); }

const CATS = ['식비','생활/마트','주거/관리비','통신','교통','의료','보험','구독','교육/도서','여가','경조사','교습소','연구/업무','기타'];

/* ══ 계산 ══════════════════════════════════════════════ */
function accountBalance(id){
  const a = S.accounts.find(x=>x.id===id); if(!a) return 0;
  let b = a.opening||0;
  for(const t of S.txns){
    if(t.type==='income' && t.accountId===id) b += t.amount;
    else if(t.type==='expense' && t.accountId===id) b -= t.amount;
    else if(t.type==='transfer'){ if(t.accountId===id) b -= t.amount; if(t.toAccountId===id) b += t.amount; }
    else if(t.type==='cardpay' && t.accountId===id) b -= t.amount;
  }
  return b;
}
function cardDue(id){
  const c = S.cards.find(x=>x.id===id); if(!c) return 0;
  let d = c.opening||0;
  for(const t of S.txns){
    if(t.type==='expense' && t.cardId===id) d += t.amount;
    else if(t.type==='cardpay' && t.cardId===id) d -= t.amount;
  }
  return d;
}
const isSaving = a => a.kind==='savings';
/** 쓸 수 있는 돈에서 빼두는 통장: 적금과 '모아두는 통장'으로 표시한 계좌 */
const isParked = a => a.kind==='savings' || !!a.parked;
/** 청구 마감 기준. billEnd = {m:-1|0, d:0|1~31} — m은 결제월 기준 몇 달 전, d는 0이면 말일.
    기본값은 전월 1일~말일 사용분이 당월 결제일에 나가는 형태 */
const defaultBillEnd = { m:-1, d:0 };
function billEndOf(c){ const b = c.billEnd || defaultBillEnd; return { m: b.m||0, d: b.d||0 }; }
const monthAdd = (idx, k) => idx + k;
const idxToYM = idx => ({ y: Math.floor(idx/12), m: idx%12 });

/** 결제월(idx)에 청구되는 사용분의 마감일 */
function cutoffOf(c, idx){
  const be = billEndOf(c);
  const { y, m } = idxToYM(monthAdd(idx, be.m));
  const last = new Date(y, m+1, 0).getDate();
  return ymd(new Date(y, m, be.d ? Math.min(be.d, last) : last));
}
/** 결제월(idx)의 실제 결제일 — 주말이면 다음 영업일 */
function payDateOf(c, idx){
  const { y, m } = idxToYM(idx);
  const last = new Date(y, m+1, 0).getDate();
  return shiftToWeekday(new Date(y, m, Math.min(c.payDay||1, last)));
}
/** 그 날 쓴 돈이 어느 결제월에 청구되는지 */
function billMonthIdx(c, dateStr){
  if(!c.payDay) return null;
  const [y, mm] = dateStr.split('-').map(Number);
  const start = y*12 + (mm-1);
  for(let k=0;k<4;k++){
    const idx = start + k;
    if(dateStr <= cutoffOf(c, idx)) return idx;
  }
  return null;
}

/** 미결제액을 청구 회차별로 쪼갠다. 결제 기록은 오래된 회차부터 지워 나간다 */
function cardBuckets(c){
  const byB = {};
  if(c.opening) byB.before = c.opening;                // 직접 입력한 금액은 가장 오래된 회차로 본다
  S.txns.forEach(t=>{
    if(t.type!=='expense' || t.cardId!==c.id) return;
    const idx = billMonthIdx(c, t.date);
    const k = idx===null ? 'before' : String(idx);
    byB[k] = (byB[k]||0) + t.amount;
  });
  let paid = S.txns.filter(t=>t.type==='cardpay' && t.cardId===c.id).reduce((s,t)=>s+t.amount,0);
  const keys = Object.keys(byB).sort((a,b)=>
    a==='before'?-1 : b==='before'?1 : Number(a)-Number(b));
  const out = [];
  keys.forEach(k=>{
    let amt = byB[k];
    if(paid > 0){ const use = Math.min(paid, amt); amt -= use; paid -= use; }
    if(amt <= 0.5) return;
    if(k==='before'){ out.push({ key:k, amount:amt, label:'직접 입력한 금액' }); return; }
    const idx = Number(k);
    const from = (()=>{ const d=new Date(cutoffOf(c, idx-1)+'T00:00:00'); d.setDate(d.getDate()+1); return ymd(d); })();
    out.push({ key:k, idx, amount:amt, payDate:payDateOf(c, idx), from, to:cutoffOf(c, idx) });
  });
  return out;
}
/** 특정 결제월까지 청구되는 미결제 합계 */
function dueUpTo(c, idx){
  return cardBuckets(c).filter(b=> b.key==='before' || b.idx <= idx).reduce((s,b)=>s+b.amount,0);
}
/** 다음 결제일에 실제로 빠질 금액 */
function dueNow(c){
  const p = nextPayDate(c.payDay);
  if(!p) return cardDue(c.id);
  return dueUpTo(c, p.date.getFullYear()*12 + p.date.getMonth());
}

}

const WD = ['일','월','화','수','목','금','토'];
const dateLabel = d => (d.getMonth()+1)+'.'+d.getDate()+'('+WD[d.getDay()]+')';
const startOfToday = ()=>{ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };

/** 지정일이 토·일이면 다음 월요일로 미룬다. 카드 결제와 자동이체가 실제로 그렇게 빠진다. */
function shiftToWeekday(d){
  const w = d.getDay();
  if(w===6) d.setDate(d.getDate()+2);
  else if(w===0) d.setDate(d.getDate()+1);
  return d;
}
/** 다음 결제(납입) 예정일. {date, shifted} — shifted 는 주말 때문에 밀렸는지 */
function nextPayDate(day){
  if(!day) return null;
  const today = startOfToday(), y = today.getFullYear(), m = today.getMonth();
  for(let k=0;k<3;k++){
    const last = new Date(y, m+k+1, 0).getDate();
    const nominal = new Date(y, m+k, Math.min(day, last));
    const date = shiftToWeekday(new Date(nominal));
    if(date >= today) return { date, shifted: date.getTime() !== nominal.getTime(), nominal };
  }
  return null;
}
function daysToPay(day){
  const p = nextPayDate(day);
  return p ? Math.round((p.date - startOfToday())/86400000) : null;
}

/* ══ 자동이체 ═══════════════════════════════════════════
   적금 납입은 지정일 당일, 카드값과 그 밖의 자동이체는 주말이면 다음 영업일.
   한 번 만든 건은 autoLog 에 남겨서 지워도 다시 생기지 않는다. */

/** 특정 날짜 기준 카드 미결제 잔액 */
function cardDueAt(id, upto){
  const c = S.cards.find(x=>x.id===id); if(!c) return 0;
  let d = c.opening||0;
  for(const t of S.txns){
    if(t.date > upto) continue;
    if(t.type==='expense' && t.cardId===id) d += t.amount;
    else if(t.type==='cardpay' && t.cardId===id) d -= t.amount;
  }
  return d;
}
/** since 달부터 이번 달까지 */
function monthsSince(since){
  const out = [];
  let [y,m] = (since || monthOf(todayStr())).split('-').map(Number);
  const now = new Date(), ey = now.getFullYear(), em = now.getMonth()+1;
  while(y < ey || (y === ey && m <= em)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    if(++m > 12){ m = 1; y++; }
    if(out.length > 60) break;
  }
  return out;
}
/** 그 달의 실제 실행일. shift 가 true 면 주말은 다음 영업일로 */
function occurDate(ym, day, shift){
  const [y,m] = ym.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const d = new Date(y, m-1, Math.min(day, last));
  return shift ? shiftToWeekday(d) : d;
}
function autoNextLabel(day, shift){
  if(!day) return '';
  if(!shift){
    const p = nextPayDate(day);            // 당일 처리라 주말 보정 없이 날짜만
    const t = startOfToday(), y = t.getFullYear(), m = t.getMonth();
    for(let k=0;k<3;k++){
      const last = new Date(y, m+k+1, 0).getDate();
      const d = new Date(y, m+k, Math.min(day, last));
      if(d >= t) return dateLabel(d);
    }
    return '';
  }
  const p = nextPayDate(day);
  return p ? dateLabel(p.date) + (p.shifted ? ' 주말 밀림' : '') : '';
}

/* ══ 음력 ═══════════════════════════════════════════════
   한국천문연구원 기준으로 뽑은 변환표. 2026~2045년까지 쓸 수 있다.
   각 해의 값은 음력 1~12월 1일의 양력 MMDD 12개 + 그 달의 일수(0=30일, 9=29일) 12개.
   윤달은 다루지 않는다. 윤달에 태어난 경우도 평달로 쇠는 것이 관례다. */
const LUNAR_MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

/** 음력 → 양력 'YYYY-MM-DD'. 없는 날짜(29일까지인 달의 30일)는 그 달 말일로 맞춘다 */
function lunarToSolar(ly, lm, ld){
  const row = LUNAR[ly];
  if(!row || lm < 1 || lm > 12) return null;
  const mm = Number(row.slice((lm-1)*4, (lm-1)*4+2));
  const dd = Number(row.slice((lm-1)*4+2, (lm-1)*4+4));
  // 달이 앞 달보다 작아지는 지점에서 양력 해가 넘어간다
  let y = ly, prev = 0;
  for(let i=0;i<lm;i++){
    const m = Number(row.slice(i*4, i*4+2));
    if(i > 0 && m < prev) y++;
    prev = m;
  }
  const len = row.charAt(48 + (lm-1)) === '9' ? 29 : 30;
  const d = new Date(y, mm-1, dd);
  d.setDate(d.getDate() + Math.min(ld, len) - 1);
  return ymd(d);
}
/** 오늘 이후로 가장 가까운 음력 기념일의 양력 날짜 */
function nextLunar(lm, ld, after){
  const from = after || todayStr();
  const y0 = Number(from.slice(0,4));
  for(let y=y0; y<=y0+6; y++){
    const s = lunarToSolar(y, lm, ld);
    if(s && s > from) return s;
  }
  return null;
}
const lunarLabel = p => p.lunar ? '음력 '+p.lunar.m+'.'+p.lunar.d : '';

/** 반복 예정 지출의 다음 회차 날짜. 오늘보다 뒤가 될 때까지 넘긴다 */
function rollPlanDate(dateStr, repeat, anchor, lunar){
  if(repeat==='lunar' && lunar) return nextLunar(lunar.m, lunar.d, dateStr);
  if(!repeat) return null;
  let [Y,M,D] = dateStr.split('-').map(Number);
  D = anchor || D;                                     // 31일·2월 29일이 앞선 달에 밀려 굳지 않도록 원래 날짜 기준
  const today = todayStr();
  for(let i=0;i<200;i++){
    if(repeat==='yearly') Y++;
    else { M++; if(M>12){ M=1; Y++; } }
    const last = new Date(Y, M, 0).getDate();          // 2월 29일 같은 날은 그 달 말일로 맞춘다
    const s = Y+'-'+String(M).padStart(2,'0')+'-'+String(Math.min(D,last)).padStart(2,'0');
    if(s > today) return s;
  }
  return null;
}

/** 밀린 자동이체를 오늘까지 만들어 넣는다 */
function runAutos(){
  if(!S.autoLog) S.autoLog = {};
  const log = S.autoLog, today = startOfToday();
  let made = 0;
  const put = (key, txn)=>{
    if(log[key]) return;
    log[key] = txn.date;
    S.txns.push(Object.assign({id:uid(), seq:Date.now()+made, key, auto:true}, txn));
    made++;
  };

  // 1) 적금·모아두는 통장 납입 — 지정일 당일
  S.accounts.filter(a=>isParked(a) && a.monthly>0 && a.payDay && a.fromId).forEach(a=>{
    if(!S.accounts.some(x=>x.id===a.fromId)) return;
    monthsSince(a.since).forEach(ym=>{
      const d = occurDate(ym, a.payDay, false);
      if(d > today) return;
      put('auto:acc:'+a.id+':'+ym, {
        type:'transfer', amount:a.monthly, accountId:a.fromId, toAccountId:a.id,
        date:ymd(d), memo:a.name+' 자동납입'
      });
    });
  });

  // 2) 카드값 자동 출금 — 영업일, 그 시점 미결제 잔액 전액
  S.cards.filter(c=>c.type==='credit' && c.auto && c.payDay && c.accountId).forEach(c=>{
    monthsSince(c.since).forEach(ym=>{
      const d = occurDate(ym, c.payDay, true);
      if(d > today) return;
      const key = 'auto:card:'+c.id+':'+ym;
      if(log[key]) return;
      const due = dueUpTo(c, Number(ym.slice(0,4))*12 + Number(ym.slice(5,7)) - 1);   // 그 회차까지의 몫만
      if(due <= 0){ log[key] = 'none'; return; }      // 낼 게 없으면 건너뛰고 기록만 남긴다
      put(key, { type:'cardpay', amount:due, cardId:c.id, accountId:c.accountId, date:ymd(d), memo:'자동 출금' });
    });
  });

  // 3) 등록한 자동이체 — 영업일
  (S.autos||[]).filter(x=>!x.off).forEach(x=>{
    if(!x.day || !x.amount || !S.accounts.some(a=>a.id===x.fromId)) return;
    if(x.kind==='transfer' && !S.accounts.some(a=>a.id===x.toId)) return;
    monthsSince(x.since).forEach(ym=>{
      const d = occurDate(ym, x.day, true);
      if(d > today) return;
      const base = { amount:x.amount, accountId:x.fromId, date:ymd(d), memo:x.name };
      put('auto:tx:'+x.id+':'+ym, x.kind==='transfer'
        ? Object.assign({type:'transfer', toAccountId:x.toId}, base)
        : Object.assign({type:'expense', category:x.category||'기타'}, base));
    });
  });

  if(made){ saveCache(); queuePush(); }
  return made;
}

      return `${c.name} ${dateLabel(p.date)}${p.shifted?'(주말 밀림)':''} ${n===0?'오늘':n+'일 뒤'} ${won(cardDue(c.id))}`; });

  app.innerHTML = `

    <div class="label">카드값 빼고 실제 쓸 수 있는 돈</div>
    <span class="figure num ${free<0?'negative':''}">${won(free)}</span>
    <div class="equation num">
      <span>입출금·현금 <b>${won(cash)}</b></span><span class="op">−</span>
      <span>카드 미결제 전체 <b>${won(due)}</b></span>
    </div>
    ${saved?`<div class="equation num" style="margin-top:7px">
      <span class="op">따로</span><span>모아둔 돈 <b>${won(saved)}</b></span>

          <span class="amt num ${c.type==='credit'?'due':''}">${c.type==='credit'?won(dueNow(c)):'즉시 출금'}</span>

            <button class="icon" data-del-card="${c.id}">삭제</button>

        </div>

      <button class="addlink" data-open="card">카드 추가</button>
      ${due>dueNowSum?`<div class="brk num" style="padding-top:8px">아직 청구 안 된 사용분 ${won(due-dueNowSum)} 은 그다음 결제일 몫입니다</div>`:''}
      ${cardUse.some(u=>u.n>0)||cashOut?`
        <div class="subhead"><span>${Number(month.slice(5))}월 카드 사용</span><span class="num">${won(cardUseTotal)}</span></div>
        ${cardUse.map(u=>`
          <div class="row">
            <span class="name" style="${u.n?'':'opacity:.5'}"><span class="t">${esc(u.c.name)}</span><span class="s">${u.n}건${u.c.type==='credit'?'':' · 통장에서 바로 출금'}</span></span>
            <span class="amt num" style="${u.n?'':'opacity:.5'}">${won(u.sum)}</span>
          </div>`).join('')}
        ${cashOut?`<div class="row"><span class="name"><span class="t" style="color:var(--ink-soft)">통장·현금 지출</span><span class="s">카드 아님</span></span><span class="amt num" style="color:var(--ink-soft)">${won(cashOut)}</span></div>`:''}
      `:''}
    </div>
  </div>

  <div class="actions">
    <button class="act primary" data-open="expense">지출 기록</button>
    <button class="act" data-open="income">수입 기록</button>
    <button class="act" data-open="transfer">계좌 이체</button>
    <button class="act" data-open="cardpay">카드값 결제</button>
    <button class="act" data-open="import">명세서 불러오기</button>
  </div>

  <div class="section">
    <div class="sechead"><h2>예정 지출</h2><span class="num" style="font-size:.85rem;color:var(--ink-soft)">${plans.length?won(plans.reduce((s,p)=>s+p.amount,0)):''}</span></div>
    ${plans.length? plans.map(p=>{
      const late = p.date < todayStr();
      const dd = Math.round((new Date(p.date+'T00:00:00') - startOfToday())/86400000);
      return `
      <div class="row">
        <span class="name"><span class="t">${esc(p.name)}${p.repeat?` <span class="tag">${p.repeat==='lunar'?'음력 매년':p.repeat==='yearly'?'매년':'매달'}</span>`:''}${late?' <span class="tag" style="color:var(--out);border-color:var(--out)">지난 날짜</span>':''}</span>
          <span class="s">${p.lunar?lunarLabel(p)+' · ':''}${p.date.slice(5).replace('-','.')} · ${late? Math.abs(dd)+'일 지남' : dd===0?'오늘':dd+'일 뒤'}${p.category?' · '+esc(p.category):''}</span></span>
        <span class="amt num">${won(p.amount)}</span>
        <span class="tools">
          <button class="icon" data-done-plan="${p.id}">썼음</button>
          ${p.repeat?`<button class="icon" data-skip-plan="${p.id}">넘기기</button>`:''}
          <button class="icon" data-edit-plan="${p.id}">수정</button>
          <button class="icon" data-del-plan="${p.id}">삭제</button>
        </span>
      </div>`;}).join('') : `<div class="hint">생일, 경조사, 세금처럼 날짜가 정해진 목돈을 넣어두면 쓸 수 있는 돈에서 미리 빼서 보여줍니다.</div>`}
    <button class="addlink" data-open="plan">예정 지출 추가</button>
  </div>

  <div class="section">
    <div class="sechead"><h2>자동이체</h2><span class="num" style="font-size:.85rem;color:var(--ink-soft)">매달 ${won(autoMonthly)}</span></div>
    ${autoRows.length? autoRows.join('') : `<div class="hint">등록된 자동이체가 없습니다. 매달 같은 날 빠지는 이체나 고정 지출을 넣어두면 그날 알아서 기록됩니다.</div>`}
    <button class="addlink" data-open="auto">자동이체 추가</button>
  </div>

  <div class="section">
    <div class="sechead">
      <h2>${month.replace('-','년 ')}월 흐름</h2>

        ${months.map(m=>`<option value="${m}" ${m===month?'selected':''}>${m.replace('-','.')}</option>`).join('')}
      </select>
    </div>
    <div class="pair">
      <div class="o"><span>쓴 돈</span><strong class="num">${won(mOut)}</strong></div>
      <div class="i"><span>들어온 돈</span><strong class="num">${won(mIn)}</strong></div>
      <div><span>남은 흐름</span><strong class="num">${won(mIn-mOut)}</strong></div>
      ${mSave?`<div><span>모아둔 돈에 넣은 금액</span><strong class="num">${won(mSave)}</strong></div>`:''}
    </div>
    ${cats.length?`<div class="bars">${cats.map(([c,v])=>`
      <div class="bar">
        <span>${esc(c)}</span>
        <span class="track"><span class="fill" style="width:${Math.max(3,v/catMax*100)}%"></span></span>
        <span class="v num">${won(v)}</span>
      </div>`).join('')}</div>`:`<div class="hint">이 달의 지출 기록이 없습니다.</div>`}
  </div>

  <div class="section" style="border-bottom:0">
    <div class="sechead">
      <h2>거래 내역</h2>
      <span class="filters">
        ${[['all','전체'],['expense','지출'],['income','수입'],['transfer','이체'],['cardpay','카드결제']]
          .map(([k,l])=>`<button class="chip" data-filter="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}
      </span>
    </div>
    ${shown.length?`<div class="ledger">${shown.map(t=>{
      const sign = t.type==='income'?'+':t.type==='expense'?'−':'';
      const cls = t.type==='income'?'i':t.type==='expense'?'o':'n';
      const title = t.memo || (t.type==='expense'?(t.category||'지출'):t.type==='income'?'수입':t.type==='transfer'?transferTitle(t):'카드값 결제');
      const sub = [t.type==='expense'&&t.category?t.category:null, methodLabel(t)].filter(Boolean).join(' · ');
      return `<div class="lrow">
        <span class="d num">${t.date.slice(5).replace('-','.')}</span>
        <span class="m"><span class="t">${esc(title)}</span><span class="s">${esc(sub)}</span></span>
        <span class="a num ${cls}">${sign}${won(t.amount)}</span>
        <button class="icon x" data-del-txn="${t.id}" aria-label="이 기록 삭제">×</button>
      </div>`;}).join('')}</div>
      ${list.length>60?`<div class="hint">최근 60건만 보입니다. 전체는 CSV로 내보내 보세요.</div>`:''}`
    :`<div class="hint">기록이 없습니다. 위에서 첫 지출을 남겨 보세요.</div>`}
  </div>`;
  bind();
}

function bind(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openForm(b.dataset.open));
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=demo);
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>openForm('cardpay',{cardId:b.dataset.pay}));
  document.querySelectorAll('[data-edit-plan]').forEach(b=>b.onclick=()=>openForm('plan',{id:b.dataset.editPlan}));
  document.querySelectorAll('[data-del-plan]').forEach(b=>b.onclick=()=>{
    const p=(S.plans||[]).find(v=>v.id===b.dataset.delPlan);
    if(p&&p.repeat&&!confirm(`'${p.name}'은 ${p.repeat==='yearly'?'매년':'매달'} 반복입니다. 앞으로도 안 쓸 거면 지우고, 이번만 넘길 거면 넘기기를 누르세요.\n\n지울까요?`)) return;
    S.plans=(S.plans||[]).filter(v=>v.id!==b.dataset.delPlan); commit('예정 지출을 지웠습니다.');
  });
  document.querySelectorAll('[data-skip-plan]').forEach(b=>b.onclick=()=>{
    const p=(S.plans||[]).find(v=>v.id===b.dataset.skipPlan); if(!p) return;
    const next=rollPlanDate(p.date,p.repeat,p.anchor,p.lunar);
    if(!next){ toast('다음 날짜를 계산할 수 없습니다.'); return; }
    p.date=next; commit(`다음은 ${next.replace(/-/g,'.')}입니다.`);
  });
  document.querySelectorAll('[data-done-plan]').forEach(b=>b.onclick=()=>{
    const p=(S.plans||[]).find(v=>v.id===b.dataset.donePlan); if(!p) return;
    openForm('expense',{plan:p});
  });
  document.querySelectorAll('[data-edit-auto]').forEach(b=>b.onclick=()=>openForm('auto',{id:b.dataset.editAuto}));
  document.querySelectorAll('[data-off-auto]').forEach(b=>b.onclick=()=>{
    const x=(S.autos||[]).find(v=>v.id===b.dataset.offAuto); if(!x) return;
    x.off = !x.off;
    if(!x.off) x.since = monthOf(todayStr());     // 다시 켤 때 지난 달을 소급하지 않는다
    const back = !x.off;
    commit(back?'자동이체를 다시 켰습니다.':'자동이체를 멈췄습니다.');
    if(back && runAutos()) render();
  });
  document.querySelectorAll('[data-del-auto]').forEach(b=>b.onclick=()=>{
    const x=(S.autos||[]).find(v=>v.id===b.dataset.delAuto); if(!x) return;
    if(!confirm(`'${x.name}' 자동이체를 지울까요? 이미 만들어진 기록은 그대로 남습니다.`)) return;
    S.autos = S.autos.filter(v=>v.id!==x.id);
    commit('자동이체를 지웠습니다.');
  });
  document.querySelectorAll('[data-deposit]').forEach(b=>b.onclick=()=>{
    const a=S.accounts.find(x=>x.id===b.dataset.deposit);
    openForm('transfer',{toAccountId:a.id, amount:a.monthly||0, memo:a.name+' 납입'});
  });
  document.querySelectorAll('[data-edit-account]').forEach(b=>b.onclick=()=>openForm('account',{id:b.dataset.editAccount}));
  document.querySelectorAll('[data-edit-card]').forEach(b=>b.onclick=()=>openForm('card',{id:b.dataset.editCard}));
  document.querySelectorAll('[data-del-account]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delAccount, a=S.accounts.find(x=>x.id===id);
    if(S.txns.some(t=>t.accountId===id||t.toAccountId===id) || S.cards.some(c=>c.accountId===id)){
      toast('이 통장을 쓰는 기록이나 카드가 있어 지울 수 없습니다.'); return;
    }
    if(!confirm(`'${a.name}'을 지울까요?`)) return;
    S.accounts=S.accounts.filter(x=>x.id!==id); commit('통장을 지웠습니다.');
  });
  document.querySelectorAll('[data-del-card]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.delCard, c=S.cards.find(x=>x.id===id);
    if(S.txns.some(t=>t.cardId===id)){ toast('이 카드로 남긴 기록이 있어 지울 수 없습니다.'); return; }
    if(!confirm(`'${c.name}'을 지울까요?`)) return;
    S.cards=S.cards.filter(x=>x.id!==id); commit('카드를 지웠습니다.');
  });
  document.querySelectorAll('[data-del-txn]').forEach(b=>b.onclick=()=>{
    S.txns=S.txns.filter(t=>t.id!==b.dataset.delTxn); commit('기록을 지웠습니다.');
  });
  const ms=$('#monthSel'); if(ms) ms.onchange=()=>{month=ms.value;render();};
}

/* ══ 입력 폼 ═══════════════════════════════════════════ */
function closeModal(){ $('#veil').classList.remove('open'); $('#modal').innerHTML=''; }
$('#veil').addEventListener('click', e=>{ if(e.target.id==='veil') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function moneyInput(el){
  if(!el) return;
  el.addEventListener('input', ()=>{
    const digits = el.value.replace(/[^\d]/g,'');
    el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  });
}
const parseMoney = el => Number(String(el.value).replace(/[^\d]/g,''))||0;
function accOptions(sel){
  return S.accounts.map(a=>{
    const tag = a.kind==='savings'?' [적금]':a.parked?' [모아두는]':a.kind==='cash'?' [현금]':'';
    return `<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}${tag} (${won(accountBalance(a.id))})</option>`;
  }).join('');
}

function openForm(kind, ctx={}){
  const m=$('#modal');
  if(kind==='import'){ importModal(); return; }
  if(['expense','income','transfer','cardpay','auto'].includes(kind) && !S.accounts.length){
    openForm('account'); toast('먼저 통장을 등록해 주세요.'); return;
  }
  if(kind==='transfer' && S.accounts.length<2){ toast('이체하려면 통장이 두 개 이상 필요합니다.'); return; }
  if(kind==='cardpay' && !S.cards.some(c=>c.type==='credit')){ toast('결제할 신용카드가 없습니다.'); return; }

  if(kind==='account'){
    const a = ctx.id? S.accounts.find(x=>x.id===ctx.id):null;
    m.innerHTML=`
      <h3>${a?'통장 수정':'통장 추가'}</h3>
      <p class="sub">${a?'이름과 기준 잔액을 고칠 수 있습니다.':'지금 통장에 찍힌 잔액을 그대로 넣어 주세요.'}</p>
      <div class="field"><label for="f1">이름</label><input id="f1" value="${a?esc(a.name):''}" placeholder="예: 국민 주거래"></div>
      <div class="field"><label>종류</label><div class="seg" id="kind">
        <button type="button" data-v="bank" aria-pressed="${!a || !['cash','savings'].includes(a.kind)}">입출금</button>
        <button type="button" data-v="savings" aria-pressed="${!!(a&&a.kind==='savings')}">적금</button>
        <button type="button" data-v="cash" aria-pressed="${!!(a&&a.kind==='cash')}">현금</button>
      </div></div>
      <div class="field"><label for="f2">${a?'기준 잔액':'현재 잔액'}</label><input id="f2" class="money" inputmode="numeric" value="${a?(a.opening||0).toLocaleString('ko-KR'):''}" placeholder="0">

      </div>
      <div id="savingOnly">

          <div class="field"><label for="f3">매달 넣는 금액</label><input id="f3" class="money" inputmode="numeric" value="${a&&a.monthly?a.monthly.toLocaleString('ko-KR'):''}" placeholder="0"><div class="note">정해두지 않았다면 비워두세요</div></div>
          <div class="field"><label for="f4">넣는 날</label><input id="f4" inputmode="numeric" value="${a&&a.payDay?a.payDay:''}" placeholder="25"><div class="note">매월 며칠</div></div>
        </div>
        <div class="field"><label for="f6">나가는 통장</label>
          <select id="f6"><option value="">자동이체 안 함 (직접 넣기)</option>${
            S.accounts.filter(x=>!isParked(x)&&(!a||x.id!==a.id)).map(x=>`<option value="${x.id}" ${a&&a.fromId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')
          }</select>
          <div class="note">지정하면 넣는 날 당일에 이 통장에서 자동으로 옮겨 기록합니다. 적금은 주말에도 당일 출금됩니다.</div>
        </div>
        <div class="field" id="maturityWrap"><label for="f5">만기일</label><input id="f5" type="date" value="${a&&a.maturity?a.maturity:''}"><div class="note">몰라도 됩니다. 비워두면 표시만 생략됩니다.</div></div>
      </div>
      <div class="err" id="err"></div>
      <div class="mfoot"><span></span><span class="right">
        <button class="act" id="cancel">취소</button><button class="act primary" id="ok">${a?'저장':'추가'}</button>
      </span></div>`;
    let kindV = a? (a.kind||'bank') : 'bank';
    const parked = ()=> kindV!=='savings' && $('#park') && $('#park').checked;
    const syncKind=()=>{
      const sv = kindV==='savings';
      $('#parkWrap').style.display = sv?'none':'block';       // 적금은 언제나 제외 대상
      $('#savingOnly').style.display = (sv||parked())?'block':'none';
      $('#maturityWrap').style.display = sv?'block':'none';
      $('#openNote').textContent = (sv||parked())
        ? (a?'지금까지 모인 금액입니다. 넣은 기록은 이 위에 더해집니다.':'지금까지 모인 금액을 넣어 주세요.')
        : (a?'기록된 거래는 이 금액 위에 다시 계산됩니다.':'');
    };
    m.querySelectorAll('#kind button').forEach(b=>b.onclick=()=>{
      kindV=b.dataset.v;
      m.querySelectorAll('#kind button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      syncKind();
    });
    $('#park').onchange = syncKind;
    syncKind(); moneyInput($('#f2')); moneyInput($('#f3'));
    $('#ok').onclick=()=>{
      const name=$('#f1').value.trim(); if(!name){$('#err').textContent='이름을 입력해 주세요.';return;}
      const isPark = parked();
      const rec={ name, kind:kindV, opening:parseMoney($('#f2')), parked:isPark };
      if(kindV==='savings' || isPark){
        rec.monthly = parseMoney($('#f3'));
        rec.payDay = Math.min(31,Math.max(0,Number(String($('#f4').value).replace(/[^\d]/g,''))||0));
        rec.maturity = kindV==='savings' ? ($('#f5').value || '') : '';
        rec.fromId = $('#f6').value || '';
        if(rec.fromId && !(a && a.since)) rec.since = monthOf(todayStr());   // 지난 달까지 소급하지 않는다
      }else{ rec.monthly=0; rec.payDay=null; rec.maturity=''; rec.fromId=''; }
      if(a) Object.assign(a,rec); else S.accounts.push(Object.assign({id:uid()},rec));
      closeModal(); commit(a?'통장을 저장했습니다.':(kindV==='savings'?'적금 통장을 추가했습니다.':(isPark?'모아두는 통장을 추가했습니다.':'통장을 추가했습니다.')));
    };
  }

  else if(kind==='card'){

        <button type="button" data-v="debit" aria-pressed="${!!(c&&c.type==='debit')}">체크카드</button>

      <div class="field"><label for="f2">결제 통장</label><select id="f2">${accOptions(c?c.accountId:null)}</select></div>

        <label for="cauto" style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;color:var(--ink)">
          <input type="checkbox" id="cauto" ${c&&c.auto?'checked':''} style="width:16px;height:16px;margin-top:3px;accent-color:#17233A">
          <span>결제일에 자동으로 출금</span>
        </label>
        <div class="note">결제일이 주말이면 다음 영업일에 처리합니다. 그날까지 남은 미결제 잔액 전액을 결제 통장에서 뺍니다.</div>
      </div>
      <div class="err" id="err"></div>
      <div class="mfoot"><span></span><span class="right">
        <button class="act" id="cancel">취소</button><button class="act primary" id="ok">${c?'저장':'추가'}</button>
      </span></div>`;
    let typeV = c&&c.type==='debit'?'debit':'credit';
    let bem = billEndOf(c||{}).m === 0 ? 0 : -1;
    const billPreview=()=>{
      const d = Number(String($('#f7').value).replace(/[^\d]/g,''))||0;
      const day = Math.min(31,Math.max(0,d));
      const fake = { payDay: Math.min(31,Math.max(1,Number(String($('#f3').value).replace(/[^\d]/g,''))||1)), billEnd:{m:bem,d:day} };
      const now = new Date();
      const idx = now.getFullYear()*12 + now.getMonth() + 1;       // 다음 달 결제분으로 예시
      const from = (()=>{ const x=new Date(cutoffOf(fake, idx-1)+'T00:00:00'); x.setDate(x.getDate()+1); return ymd(x); })();
      const to = cutoffOf(fake, idx);
      $('#billNote').textContent = `${from.replace(/-/g,'.')} ~ ${to.replace(/-/g,'.')} 에 쓴 금액이 ${dateLabel(payDateOf(fake, idx))}에 나갑니다`;
    };
    const sync=()=>{ $('#creditOnly').style.display = typeV==='credit'?'grid':'none';
                     $('#autoWrap').style.display = typeV==='credit'?'block':'none';
                     $('#billWrap').style.display = typeV==='credit'?'grid':'none';
                     $('#billNote').style.display = typeV==='credit'?'block':'none';
                     if(typeV==='credit') billPreview(); };

    $('#f7').addEventListener('input', billPreview);
    $('#f3').addEventListener('input', billPreview);
    sync(); moneyInput($('#f4'));
    $('#ok').onclick=()=>{
      const name=$('#f1').value.trim(); if(!name){$('#err').textContent='이름을 입력해 주세요.';return;}

      const cauto = typeV==='credit' && $('#cauto').checked;
      const bd = Math.min(31,Math.max(0,Number(String($('#f7').value).replace(/[^\d]/g,''))||0));
      const rec={name,type:typeV,accountId:$('#f2').value,payDay:typeV==='credit'?day:null,
                 opening:typeV==='credit'?parseMoney($('#f4')):0, auto:cauto,
                 billEnd: typeV==='credit'? {m:bem, d:bd} : null};
      if(cauto && !(c && c.since)) rec.since = monthOf(todayStr());
      if(c) Object.assign(c,rec); else S.cards.push(Object.assign({id:uid()},rec));
      closeModal(); commit(c?'카드를 저장했습니다.':'카드를 추가했습니다.');
    };
  }

  else if(kind==='expense'||kind==='income'){
    const isOut = kind==='expense';
    const methods = [
      ...S.accounts.map(a=>({v:'a:'+a.id,l:a.name+' ('+kindName(a)+')'})),
      ...(isOut? S.cards.map(c=>({v:'c:'+c.id,l:c.name+(c.type==='credit'?' (신용)':' (체크)')})):[])
    ];
    m.innerHTML=`
      <h3>${ctx.plan? '예정 지출 기록' : (isOut?'지출 기록':'수입 기록')}</h3>

        : (isOut?'신용카드로 쓰면 통장 잔액은 그대로 두고 결제 예정액에 쌓입니다.':'통장에 들어온 돈을 남깁니다.')}</p>
      <div class="field"><label for="f1">금액</label><input id="f1" class="money" inputmode="numeric" placeholder="0" value="${ctx.plan?ctx.plan.amount.toLocaleString('ko-KR'):''}"></div>
      <div class="field"><label for="f2">${isOut?'결제 수단':'받은 통장'}</label><select id="f2">${methods.map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join('')}</select></div>
      ${isOut?`<div class="field"><label for="f3">분류</label><select id="f3">${CATS.map(c=>`<option ${ctx.plan&&ctx.plan.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`:''}
      <div class="two">
        <div class="field"><label for="f4">날짜</label><input id="f4" type="date" value="${ctx.plan? todayStr() : todayStr()}"></div>
        <div class="field"><label for="f5">메모</label><input id="f5" placeholder="${isOut?'예: 마트 장보기':'예: 급여'}" value="${ctx.plan?esc(ctx.plan.name):''}"></div>
      </div>
      <div class="err" id="err"></div>
      <div class="mfoot"><span></span><span class="right">
        <button class="act" id="cancel">취소</button><button class="act primary" id="ok">기록</button>
      </span></div>`;
    moneyInput($('#f1')); $('#f1').focus();
    $('#ok').onclick=()=>{
      const amt=parseMoney($('#f1')); if(!amt){$('#err').textContent='금액을 입력해 주세요.';return;}
      const [k,id]=$('#f2').value.split(':');
      const t={id:uid(),seq:Date.now(),type:kind,amount:amt,date:$('#f4').value||todayStr(),memo:$('#f5').value.trim()};
      if(isOut) t.category=$('#f3').value;
      if(k==='a') t.accountId=id;
      else{
        const c=S.cards.find(x=>x.id===id);
        t.cardId=id;
        if(c.type==='debit') t.accountId=c.accountId;
      }
      S.txns.push(t); month=monthOf(t.date);
      let rolled = null;
      if(ctx.plan){
        const cur=(S.plans||[]).find(v=>v.id===ctx.plan.id);
        const next = cur && cur.repeat ? rollPlanDate(cur.date, cur.repeat, cur.anchor, cur.lunar) : null;
        if(cur && next){ cur.date = next; rolled = next; }
        else S.plans=(S.plans||[]).filter(v=>v.id!==ctx.plan.id);
      }
      closeModal(); commit(ctx.plan
        ? (rolled? `기록했습니다. 다음은 ${rolled.replace(/-/g,'.')}입니다.` : '예정 지출을 기록으로 옮겼습니다.')
        : (isOut?'지출을 기록했습니다.':'수입을 기록했습니다.'));
    };
  }

  else if(kind==='transfer'){
    const spendable = S.accounts.filter(a=>!isParked(a));
    const toDefault = ctx.toAccountId || (S.accounts.find(a=>a.id!==(spendable[0]||S.accounts[0]).id)||S.accounts[1]||{}).id;
    const fromDefault = (spendable.find(a=>a.id!==toDefault) || S.accounts.find(a=>a.id!==toDefault) || S.accounts[0]).id;
    m.innerHTML=`
      <h3>${ctx.toAccountId? transferTitle({toAccountId:ctx.toAccountId}) : '계좌 이체'}</h3>
      <p class="sub">한 통장에서 다른 통장으로 옮깁니다. 가진 돈 총액은 그대로지만, 모아두는 통장으로 옮기면 쓸 수 있는 돈에서는 빠집니다.</p>
      <div class="field"><label for="f1">금액</label><input id="f1" class="money" inputmode="numeric" placeholder="0" value="${ctx.amount?ctx.amount.toLocaleString('ko-KR'):''}"></div>
      <div class="two">
        <div class="field"><label for="f2">보내는 통장</label><select id="f2">${accOptions(fromDefault)}</select></div>
        <div class="field"><label for="f3">받는 통장</label><select id="f3">${accOptions(toDefault)}</select></div>
      </div>
      <div class="two">
        <div class="field"><label for="f4">날짜</label><input id="f4" type="date" value="${todayStr()}"></div>
        <div class="field"><label for="f5">메모</label><input id="f5" placeholder="예: 생활비 이동" value="${esc(ctx.memo||'')}"></div>
      </div>
      <div class="err" id="err"></div>
      <div class="mfoot"><span></span><span class="right">
        <button class="act" id="cancel">취소</button><button class="act primary" id="ok">이체 기록</button>
      </span></div>`;
    moneyInput($('#f1')); $('#f1').focus();
    $('#ok').onclick=()=>{
      const amt=parseMoney($('#f1')); if(!amt){$('#err').textContent='금액을 입력해 주세요.';return;}
      const from=$('#f2').value, to=$('#f3').value;
      if(from===to){$('#err').textContent='보내는 통장과 받는 통장이 같습니다.';return;}
      const date=$('#f4').value||todayStr();
      S.txns.push({id:uid(),seq:Date.now(),type:'transfer',amount:amt,accountId:from,toAccountId:to,date,memo:$('#f5').value.trim()});
      month=monthOf(date); closeModal(); commit('이체를 기록했습니다.');
    };
  }

  else if(kind==='cardpay'){
    const credits=S.cards.filter(c=>c.type==='credit');
    const cur = ctx.cardId? credits.find(c=>c.id===ctx.cardId) : credits[0];
    m.innerHTML=`
      <h3>카드값 결제</h3>
      <p class="sub">결제 예정액을 통장에서 실제로 빼냅니다.</p>
      <div class="field"><label for="f2">카드</label><select id="f2">${credits.map(c=>`<option value="${c.id}" ${cur&&c.id===cur.id?'selected':''}>${esc(c.name)} · 예정 ${won(cardDue(c.id))}</option>`).join('')}</select></div>
      <div class="field"><label for="f1">결제 금액</label><input id="f1" class="money" inputmode="numeric" value="${cur?Math.max(0,dueNow(cur)).toLocaleString('ko-KR'):''}">
        <div class="note">
          <button type="button" class="icon" id="thisBill" style="padding:0;border-bottom:1px solid var(--rule)">이번 청구분</button>
          · <button type="button" class="icon" id="full" style="padding:0;border-bottom:1px solid var(--rule)">미결제 전액</button>
        </div></div>
      <div class="field"><label for="f3">출금 통장</label><select id="f3">${accOptions(cur?cur.accountId:null)}</select></div>
      <div class="field"><label for="f4">날짜</label><input id="f4" type="date" value="${todayStr()}">
        <div class="note" id="payNote"></div></div>
      <div class="err" id="err"></div>
      <div class="mfoot"><span></span><span class="right">
        <button class="act" id="cancel">취소</button><button class="act primary" id="ok">결제 기록</button>
      </span></div>`;
    moneyInput($('#f1'));
    const curCard = ()=> S.cards.find(x=>x.id===$('#f2').value);
    const syncCard=()=>{
      const c=curCard();
      $('#f1').value=Math.max(0,dueNow(c)).toLocaleString('ko-KR');
      if(c.accountId) $('#f3').value=c.accountId;
      const p=nextPayDate(c.payDay);
      const rest = cardDue(c.id) - dueNow(c);
      $('#payNote').innerHTML = (p
        ? `이번 결제 예정일 ${dateLabel(p.date)}${p.shifted?' — 원래 '+c.payDay+'일인데 주말이라 밀립니다':''}`
        : '카드 수정에서 결제일을 넣으면 예정일을 알려줍니다.')
        + (rest>0? `<br>이번 달 사용분 ${won(rest)} 은 다음 결제일 몫이라 빼뒀습니다.` : '');
    };
    syncCard();
    $('#f2').onchange=syncCard;
    $('#thisBill').onclick=()=>{ $('#f1').value=Math.max(0,dueNow(curCard())).toLocaleString('ko-KR'); };
    $('#full').onclick=()=>{ $('#f1').value=Math.max(0,cardDue(curCard().id)).toLocaleString('ko-KR'); };
    $('#ok').onclick=()=>{
      const amt=parseMoney($('#f1')); if(!amt){$('#err').textContent='금액을 입력해 주세요.';return;}
      const date=$('#f4').value||todayStr();
      S.txns.push({id:uid(),seq:Date.now(),type:'cardpay',amount:amt,cardId:$('#f2').value,accountId:$('#f3').value,date,memo:''});
      month=monthOf(date); closeModal(); commit('카드값 결제를 기록했습니다.');
    };
  }

  else if(kind==='plan'){
    const p = ctx.id ? (S.plans||[]).find(v=>v.id===ctx.id) : null;
    m.innerHTML=`
      <h3>${p?'예정 지출 수정':'예정 지출 추가'}</h3>
      <p class="sub">아직 안 쓴 돈입니다. 기록에는 들어가지 않고, 맨 위 '쓸 수 있는 돈'에서 미리 빼서 보여줍니다.</p>
      <div class="field"><label for="p1">무엇</label><input id="p1" value="${p?esc(p.name):''}" placeholder="예: 어머니 생일 선물"></div>
      <div class="field"><label for="p2">금액</label><input id="p2" class="money" inputmode="numeric" value="${p?p.amount.toLocaleString('ko-KR'):''}" placeholder="0"></div>
      <div class="field"><label>날짜 기준</label><div class="seg" id="pcal">
        <button type="button" data-v="solar" aria-pressed="${!p||!p.lunar}">양력</button>
        <button type="button" data-v="lunar" aria-pressed="${!!(p&&p.lunar)}">음력</button>
      </div></div>
      <div class="field" id="solarWrap"><label for="p3">날짜</label><input id="p3" type="date" value="${p&&!p.lunar?p.date:todayStr()}"></div>

/* 결제대행(PG) 이름이 가맹점 앞에 붙는 경우가 많아 떼어낸다 */
const PGS = ['한국정보통신','나이스정보통신','나이스','NICE','KCP','NHN KCP','케이씨피','토스페이먼츠','이니시스','KG이니시스','(주)이니시스','KSNET','케이에스넷','스마트로','JTNET','헥토파이낸셜','다우데이타','올더게이트','페이레터','갤럭시아머니트리','세틀뱅크','다날','모빌리언스'];
function cleanMerchant(v){
  let x = String(v||'').replace(/\s+/g,' ').trim();
  for(const p of PGS){
    const re = new RegExp('^'+p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[-–—]\\s*','i');
    if(re.test(x)){ x = x.replace(re,''); break; }
  }
  return x.replace(/^\(주\)\s*/,'').replace(/\s*(주식회사|유한회사|유한회)\s*$/,'').trim();
}

];
function guessCat(name){
  const rules = S.rules || {};
  if(rules[name]) return rules[name];
  for(const k in rules){ if(k && name.includes(k)) return rules[k]; }
  for(const [re,c] of CAT_RULES){ if(re.test(name)) return c; }
  return '기타';
}

const numOf = v => Number(String(v==null?'':v).replace(/[^\d.-]/g,''))||0;
function parseDate(v, fallbackYear){
  const s = String(v||'').trim();
  let m = s.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(!m) m = s.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{2})[-./](\d{1,2})[-./](\d{1,2})$/);          // 26.08.03 같은 두 자리 연도
  if(m) return '20'+m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[-./](\d{1,2})$/);
  if(m && fallbackYear) return fallbackYear+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  m = s.match(/^(\d{8})$/);
  if(m) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  return null;
}

function decodeText(buf){
  let s = new TextDecoder('utf-8').decode(buf);
  if(s.indexOf('\uFFFD') >= 0){
    try{ s = new TextDecoder('euc-kr').decode(buf); }catch(e){}
  }
  return s;
}
function loadScript(src){
  return new Promise((res,rej)=>{
    const el=document.createElement('script'); el.src=src; el.onload=res;
    el.onerror=()=>rej(new Error('엑셀 해석기를 불러올 수 없습니다')); document.head.appendChild(el);
  });
}
function gridFromHtml(text){
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const grid = [];
  doc.querySelectorAll('tr').forEach(tr=>{
    const cells = [...tr.querySelectorAll('td,th')].map(td=>td.textContent.replace(/\s+/g,' ').trim());
    if(cells.length) grid.push(cells);
  });
  return grid;
}
function gridFromCsv(text){
  const out=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"' && text[i+1]==='"'){ cell+='"'; i++; }
      else if(ch==='"') q=false;
      else cell+=ch;
    }else if(ch==='"') q=true;
    else if(ch===','||ch==='\t'){ row.push(cell.trim()); cell=''; }
    else if(ch==='\n'){ row.push(cell.trim()); if(row.some(Boolean)) out.push(row); row=[]; cell=''; }
    else if(ch!=='\r') cell+=ch;
  }
  row.push(cell.trim()); if(row.some(Boolean)) out.push(row);
  return out;
}
async function readGrid(file){
  const buf = await file.arrayBuffer();
  const b = new Uint8Array(buf);
  const isZip = b[0]===0x50 && b[1]===0x4B;              // .xlsx
  const isOle = b[0]===0xD0 && b[1]===0xCF;              // 옛 .xls (국민카드 등)
  if(isZip || isOle){
    if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(buf,{type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c==null?'':c).trim()));
  }
  const text = decodeText(buf);
  if(/<t(able|r)\b/i.test(text)) return gridFromHtml(text);
  return gridFromCsv(text);
}

/* 열 이름은 카드사마다 달라서 우선순위를 두고 찾는다.
   앞 패턴이 먼저 잡힌다 — '이용하신곳'(국민)이 빈 '가맹점정보' 열보다 앞이어야 한다. */
const COLS = {
  date:      [/이용일자?/, /거래일자?/, /승인일자?/, /사용일자?/, /매출일자?/, /^일자$/],
  merchant:  [/이용하신\s*곳/, /이용가맹점/, /가맹점명/, /이용처|사용처/, /이용내역|사용내역/, /적요|내용|상호/, /가맹점/],
  amount:    [/국내이용금액/, /이용금액/, /승인금액/, /거래금액/, /사용금액/, /^금액/],
  principal: [/결제원금/, /청구원금/, /청구금액/, /결제금액[\s\S]*원금/, /^원금$/],
  fee:       [/수수료/],
  discount:  [/할인금액/, /즉시할인/],
  card:      [/이용카드명/, /이용카드/, /카드명/, /카드종류/],
  inst:      [/할부/],
  status:    [/^상태/, /승인상태|매입상태|취소여부/],
  approval:  [/승인번호/]
};
const BAD_AMOUNT = /해외|할인|포인트|적립|잔액|수수료|누적|한도/;

function findCols(header){
  const col = {};
  for(const key in COLS){
    col[key] = -1;
    for(const re of COLS[key]){
      const i = header.findIndex(c=>{
        if(!re.test(c)) return false;
        if(key==='amount' && BAD_AMOUNT.test(c) && !/국내이용금액/.test(c)) return false;
        if(key==='card' && /카드번호/.test(c)) return false;
        return true;
      });
      if(i >= 0){ col[key] = i; break; }
    }
  }
  return col;
}

/** 헤더 위쪽 요약 영역에서 명세서가 스스로 밝힌 합계·건수를 찾는다 */
function statedTotals(pre){
  const pair = (row, from)=>{
    for(let k=from+1;k<row.length;k++){
      const m = String(row[k]).match(/^\s*([\d,]+(?:\.\d+)?)\s*\/\s*([\d,.]+)\s*$/);
      if(m) return numOf(m[1]);
    }
    return null;
  };
  let amount=null, count=null;
  pre.forEach(row=>row.forEach((c,i)=>{
    const s = String(c);
    if(!/정상[\s\S]*취소/.test(s)) return;
    if(/금액/.test(s) && amount===null) amount = pair(row,i);
    if(/건/.test(s)  && count===null)  count  = pair(row,i);
  }));
  return (amount!==null || count!==null) ? {amount,count} : null;
}

/** 표에서 열 위치를 찾아 거래 목록을 뽑아낸다 */
function extract(grid){
  let hi = -1, col = null, span = 1;
  for(let i=0;i<Math.min(grid.length,40);i++){
    const r = grid[i];
    if(r.length < 3) continue;
    // 국민카드 명세서처럼 '이번달 결제금액 / 원금·수수료' 두 줄 헤더면 합쳐서 본다
    const nxt = grid[i+1] || [];
    const twoRow = nxt.length && !parseDate(nxt[0]) && !parseDate(nxt[1]) &&
                   nxt.some(c=>c && /원금|수수료|국내|해외/.test(c));
    const merged = twoRow ? r.map((c,j)=>[c, nxt[j]||''].filter(Boolean).join(' ').trim()) : r;
    const c = findCols(merged);
    if(c.date < 0) continue;
    if(c.merchant < 0 && c.amount < 0) continue;
    hi = i; col = c; span = twoRow ? 2 : 1; break;
  }
  if(hi < 0) throw new Error('날짜·가맹점·금액 열을 찾지 못했습니다. 다른 형식으로 내려받아 보세요.');

  // 날짜에 연도가 없는 명세서 대비
  let year = null;
  for(let i=0;i<hi;i++){ const m=grid[i].join(' ').match(/(20\d{2})\s*[년-]/); if(m){ year=m[1]; break; } }

  let stated = statedTotals(grid.slice(0,hi));
  const useP = col.principal >= 0;
  const rows = [];
  let zeroSkipped = 0, cancelled = 0, discountSum = 0, checkSum = 0;

  for(let i=hi+span;i<grid.length;i++){
    const r = grid[i];
    const label = col.merchant>=0 ? String(r[col.merchant]||'') : '';
    const line = r.join(' ');

    // 합계 행 — '총 합계'(현대), '합   계    64 건'(국민) 모두 잡는다. '소계'는 제외
    if(/합\s*계/.test(line) && !/소\s*계/.test(line)){
      const m = line.match(/(\d[\d,]*)\s*건/);
      stated = { amount: useP ? numOf(r[col.principal]) + (col.fee>=0?numOf(r[col.fee]):0) : numOf(r[col.amount]),
                 count: m ? numOf(m[1]) : null };
      continue;
    }
    const date = parseDate(r[col.date], year);
    if(!date) continue;                                  // 소계·빈 줄·안내 문구

    const state = col.status>=0 ? String(r[col.status]||'') : '';
    if(/취소|거절|무효/.test(state)){ cancelled++; continue; }   // 승인취소 건은 청구되지 않는다

    const listed = col.amount>=0 ? numOf(r[col.amount]) : 0;
    const disc   = col.discount>=0 ? Math.abs(numOf(r[col.discount])) : 0;
    const amt = useP
      ? numOf(r[col.principal]) + (col.fee>=0 ? numOf(r[col.fee]) : 0)
      : listed - disc;
    if(!amt){ zeroSkipped++; continue; }                 // 포인트 사용 등 청구액 0

    discountSum += disc;
    checkSum += useP ? amt : listed;                     // 명세서가 밝힌 합계와 맞춰볼 기준
    const merchant = cleanMerchant(label);
    const inst = col.inst>=0 ? String(r[col.inst]||'').replace(/일시불/,'').trim() : '';
    const approval = col.approval>=0 ? String(r[col.approval]||'').trim() : '';
    rows.push({
      date, amount:amt, merchant, listed, disc, inst, approval,
      cardLabel: col.card>=0 ? String(r[col.card]||'').trim() : '',
      category: guessCat(merchant),
      key: approval ? 'ap:'+approval : date+'|'+amt+'|'+merchant
    });
  }
  if(!rows.length) throw new Error('불러올 거래를 찾지 못했습니다.');
  return { rows, stated, zeroSkipped, cancelled, discountSum, checkSum, usedPrincipal:useP };
}

/** 명세서의 카드 이름과 등록한 카드를 두 글자 단위로 견줘 본다. 확실할 때만 고른다 */
function guessCardId(label){
  const norm = t => String(t).replace(/[\s()\-_·]/g,'').toLowerCase();
  const L = norm(label);
  let best = '', score = 0;
  S.cards.forEach(c=>{
    const N = norm(c.name); let sc = 0;
    for(let i=0;i<N.length-1;i++) if(L.includes(N.slice(i,i+2))) sc++;
    if(sc > score){ score = sc; best = c.id; }
  });
  return score >= 2 ? best : '';
}

/** 가져온 내역을 불러온 묶음 단위로 모은다.
    배치 표시가 없는 예전 기록은 카드·월·승인번호 유무로 갈라 준다 */
function importGroups(){
  const g = {};
  S.txns.filter(t=>t.src==='import' && t.type==='expense').forEach(t=>{
    const k = t.batch ? 'b:'+t.batch
                      : 'o:'+(t.cardId||'none')+'|'+monthOf(t.date)+'|'+(t.approval?'ap':'no');
    if(!g[k]) g[k] = { key:k, cardId:t.cardId||'', file:t.file||'', at:t.at||'', ids:[], sum:0, months:new Set(), names:[] };
    const x = g[k];
    x.ids.push(t.id); x.sum += t.amount; x.months.add(monthOf(t.date));
    if(x.names.length < 3 && t.memo) x.names.push(t.memo.split(' (')[0]);
  });
  return Object.values(g).map(x=>({
    ...x, ym:[...x.months].sort().join(', ')
  })).sort((a,b)=> a.ym<b.ym?1 : a.ym>b.ym?-1 : 0);
}

function existingKeys(){
  const set = new Set();
  S.txns.forEach(t=>{
    if(t.key) set.add(t.key);
    if(t.approval) set.add('ap:'+t.approval);
    if(t.type==='expense') set.add(t.date+'|'+t.amount+'|'+cleanMerchant(t.memo||''));
  });
  return set;
}

/** 잘못된 카드로 들어간 내역을 옮기거나 한 번에 지운다 */
function tidyModal(){
  const m = $('#modal');
  m.classList.remove('wide');
  const groups = importGroups();
  m.innerHTML = `

    ${groups.map((g,i)=>{
      const c = S.cards.find(x=>x.id===g.cardId);
      return `
      <div class="field" style="border-top:1px solid var(--rule-soft);padding-top:12px">
        <label>${esc(g.ym)} · ${c?esc(c.name):'<span style="color:var(--out)">카드 없음</span>'} · ${g.ids.length}건 · ${won(g.sum)}</label>
        <div class="note" style="margin:0 0 7px">${g.file?esc(g.file)+' · ':''}${esc(g.names.join(', '))}${g.ids.length>3?' …':''}</div>
        <div class="prow" style="grid-template-columns:1fr auto auto;border:0;padding:0;gap:6px">
          <select data-move="${i}">
            <option value="">옮길 카드 고르기</option>
            ${S.cards.filter(x=>x.id!==g.cardId).map(x=>`<option value="${x.id}">${esc(x.name)}(으)로 옮기기</option>`).join('')}
          </select>
          <button class="act" data-domove="${i}">옮기기</button>
          <button class="act quiet" data-dropgroup="${i}" style="color:var(--out)">지우기</button>
        </div>
      </div>`;}).join('')}
    <div class="err" id="err"></div>
    <div class="mfoot"><button class="act quiet" id="back">불러오기로</button><span class="right"><button class="act" id="cancel">닫기</button></span></div>`;
  $('#veil').classList.add('open');
  $('#cancel').onclick = closeModal;
  $('#back').onclick = importModal;
  m.querySelectorAll('[data-domove]').forEach(b=>b.onclick=()=>{
    const g = groups[+b.dataset.domove];
    const to = m.querySelector(`[data-move="${b.dataset.domove}"]`).value;
    if(!to){ $('#err').textContent = '옮길 카드를 골라 주세요.'; return; }
    const set = new Set(g.ids);
    S.txns.forEach(t=>{ if(set.has(t.id)) t.cardId = to; });
    const c = S.cards.find(x=>x.id===to);
    closeModal(); commit(`${g.ids.length}건을 ${c?c.name:'다른 카드'}로 옮겼습니다.`);
  });
  m.querySelectorAll('[data-dropgroup]').forEach(b=>b.onclick=()=>{
    const g = groups[+b.dataset.dropgroup];
    if(!confirm(`${g.ym} ${g.ids.length}건(${won(g.sum)})을 지울까요? 같은 파일을 다시 불러올 수 있습니다.`)) return;
    const set = new Set(g.ids);
    S.txns.filter(t=>set.has(t.id)).forEach(t=>{ if(t.key && S.autoLog) delete S.autoLog[t.key]; });
    S.txns = S.txns.filter(t=>!set.has(t.id));
    closeModal(); commit(`${g.ids.length}건을 지웠습니다.`);
  });
}

    let added = 0, skipped = 0;
    chosen.forEach(r=>{
      const cardId = single ? fixedCard : map[r.cardLabel];
      if(!cardId){ skipped++; return; }
      const memo = r.merchant + (r.inst? ' (할부 '+r.inst+')' : '') + (r.disc? ' (할인 '+r.disc.toLocaleString('ko-KR')+')' : '');
      S.txns.push({
        id:uid(), seq:Date.now()+added, type:'expense', amount:r.amount, date:r.date,
        category:r.category, memo, cardId, key:r.key, approval:r.approval||'', src:'import',
        batch, file:fname, at
      });
      if(r.changed && r.merchant) rules[r.merchant] = r.category;
      added++;
    });
    S.rules = rules;
    if(!single) S.cardMap = map;
    month = monthOf(chosen[chosen.length-1].date);
    m.classList.remove('wide'); closeModal();
    commit(`${added}건을 넣었습니다.${skipped?` ${skipped}건은 건너뛰었습니다.`:''}`);
  };
}

/* ══ 푸터 동작 ═════════════════════════════════════════ */
$('#btnSetup').onclick = ()=>openForm('setup');
$('#btnBackup').onclick = ()=>openForm('backup');
$('#btnSync').onclick = ()=>{ if(dirty) push(); else pull({force:true}); };
$('#btnExport').onclick=()=>{
  if(!S.txns.length){ toast('내보낼 기록이 없습니다.'); return; }
  const rows=[['날짜','구분','금액','분류','수단','메모']];
  S.txns.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{
    const kn={expense:'지출',income:'수입',transfer:'이체',cardpay:'카드결제'}[t.type];
    rows.push([t.date,kn,t.amount,t.category||'',methodLabel(t),t.memo||'']);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const a=document.createElement('a'); a.href=url; a.download='통장흐름_'+todayStr()+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast('CSV로 내보냈습니다.');
};

document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pull(); });
window.addEventListener('online', ()=>{ dirty? push() : pull(); });

/* ══ 시작 ══════════════════════════════════════════════ */
loadCfg(); loadCache();
if(cfg.url && cfg.key){
  render(); pull();                       // 서버 내용을 받은 뒤 자동이체를 돌린다
}else{
  const made = runAutos(); render();
  status('', S.txns.length? '이 기기에만 저장' : '동기화 설정이 필요합니다');
  if(made) toast(`자동이체 ${made}건을 기록했습니다.`);
}
